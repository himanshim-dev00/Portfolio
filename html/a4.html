

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio UI</title>


  <link rel="stylesheet" href="../css/a4.css">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>
<body>

  <div class="container">

   
    <div class="side-menu">
      <span>Clients</span>
      <span>Research</span>
      <span>Portfolio</span>
      <span>Podcast</span>
    </div>

   
    <div class="left-card">

      <div class="about">
        <i class="fa-solid fa-plus"></i>
        <span>About Me</span>
      </div>

      <div class="profile-img">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=900&auto=format&fit=crop" alt="">
      </div>

      <div class="intro">
        <p>I'm,</p>
        <h1>John <br> Daniel</h1>
      </div>

      <div class="email">
        inquiry@jondaniel.design
        <i class="fa-regular fa-envelope"></i>
      </div>

      <div class="award-circle">
        <div class="circle">
          <h3>2025</h3>
          <p>UI DESIGN PORTFOLIO</p>
        </div>
      </div>

    </div>

   
    <div class="right-section">

      <h1 class="title">Portfolio</h1>

    
      <div class="top-section">

        <div class="video-card">

          <img src="https://images.unsplash.com/photo-1552728089-57bdde30beb3?q=80&w=1200&auto=format&fit=crop" alt="">

          <div class="play-btn">
            <i class="fa-solid fa-play"></i>
          </div>

        </div>

        <div class="stats">

          <div class="stat-card light">
            <h2>251</h2>
            <p>Projects</p>
          </div>

          <div class="stat-card purple">
            <h2>156</h2>
            <p>Awards</p>
          </div>

        </div>

      </div>

      
      <div class="bottom-cards">

        <div class="small-card gray">
          <i class="fa-brands fa-apple"></i>
          <p>Clients</p>
        </div>

        <div class="small-card black">
          <img src="https://cdn-icons-png.flaticon.com/512/2721/2721297.png" alt="">
        </div>

        <div class="award-box">
          <h2>172</h2>
          <p>Global Design <br> Awards.</p>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
